name: Keep backend awake

# Render's free plan puts the service to sleep after ~15 minutes without traffic,
# so the first visitor waits for a cold start. This pings the backend every
# 10 minutes. Set the repository variable BACKEND_URL (Settings → Secrets and
# variables → Actions → Variables), e.g. https://resume-customizer-api.onrender.com
#
# Note: GitHub may delay scheduled runs at busy times, and pauses schedules in
# repositories with no activity for 60 days (re-enable it from the Actions tab).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/ping
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL is not set; skipping."
            exit 0
          fi
          # A sleeping service can take up to a minute to answer the first request.
          curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 \
            "${BACKEND_URL%/}/api/ping"
