# Render Blueprint for the backend: https://render.com/docs/blueprint-spec
# New → Blueprint → connect this repo. Then fill in the secret values when prompted.
services:
  - type: web
    name: resume-customizer-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDERS
        value: gemini,groq
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: CORS_ORIGINS
        sync: false # e.g. https://your-app.vercel.app
      - key: CORS_ORIGIN_REGEX
        sync: false # optional, e.g. https://your-app-.*\.vercel\.app
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # Postgres URL (e.g. Neon). Leave unset to use ephemeral SQLite.
      - key: ENVIRONMENT
        value: production
